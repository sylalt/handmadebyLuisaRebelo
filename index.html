<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="theme-color" content="#f7f4ec">
  <meta name="description" content="LUISA London — a new expression of textile craftsmanship is coming soon.">
  <title>LUISA LONDON — Coming Soon</title>

  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:wght@400;500&family=Manrope:wght@300;400;500&display=swap" rel="stylesheet">

  <style>
    :root {
      color-scheme: light;
      --ivory: #f7f4ec;
      --green: #073f34;
      --muted: #77776d;
      --line: rgba(7, 63, 52, .18);
      --serif: "Cormorant Garamond", Georgia, serif;
      --sans: "Manrope", Arial, sans-serif;
    }

    * { box-sizing: border-box; }

    body {
      margin: 0;
      background: var(--ivory);
      color: var(--green);
      font-family: var(--sans);
      -webkit-font-smoothing: antialiased;
    }

    .page-shell {
      min-height: 100svh;
      padding: 28px 3.2vw 22px;
      display: flex;
      flex-direction: column;
    }

    .topbar {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 20px;
      padding-bottom: 20px;
      border-bottom: 1px solid var(--line);
      font-size: 9px;
      letter-spacing: .22em;
      text-transform: uppercase;
    }

    .topbar-place { white-space: nowrap; }

    .main {
      flex: 1;
      display: grid;
      grid-template-columns: minmax(300px, .82fr) minmax(0, 1.18fr);
      gap: clamp(36px, 6vw, 100px);
      align-items: center;
      padding: clamp(38px, 6vh, 76px) 0;
      max-width: 1600px;
      width: 100%;
      margin: 0 auto;
    }

    .intro {
      display: flex;
      flex-direction: column;
      align-items: flex-start;
      padding: 20px 0 20px clamp(0px, 2vw, 32px);
    }

    .brand-mark {
      display: block;
      width: min(100%, 430px);
      height: auto;
      margin: 0 0 clamp(48px, 9vh, 100px);
      mix-blend-mode: multiply;
    }

    .eyebrow {
      margin: 0 0 18px;
      color: #806b45;
      font-size: 9px;
      letter-spacing: .3em;
      line-height: 1.6;
      text-transform: uppercase;
    }

    h1 {
      margin: 0;
      font: 400 clamp(54px, 7.2vw, 100px)/.92 var(--serif);
      letter-spacing: -.025em;
    }

    .rule {
      width: 54px;
      height: 1px;
      margin: 30px 0 23px;
      background: #a58c60;
    }

    .statement {
      max-width: 340px;
      margin: 0;
      color: #315c50;
      font: 400 clamp(19px, 2vw, 25px)/1.38 var(--serif);
    }

    .supporting {
      margin: 34px 0 0;
      color: var(--muted);
      font-size: 9px;
      letter-spacing: .16em;
      line-height: 1.8;
      text-transform: uppercase;
    }

    .image-composition {
      display: grid;
      grid-template-columns: repeat(3, minmax(0, 1fr));
      gap: 10px;
      align-items: start;
      max-height: 690px;
      overflow: hidden;
    }

    .image-column {
      display: flex;
      flex-direction: column;
      gap: 10px;
      min-width: 0;
    }

    .image-column:nth-child(2) { padding-top: 52px; }
    .image-column:nth-child(3) { padding-top: 20px; }

    .image-column img {
      display: block;
      width: 100%;
      height: auto;
      object-fit: cover;
      background: #e8e4dc;
    }

    .image-column img:nth-child(odd) { aspect-ratio: 4 / 5; }
    .image-column img:nth-child(even) { aspect-ratio: 1 / 1; }
    .image-column:nth-child(2) img:first-child { aspect-ratio: 3 / 4; }

    .footer {
      display: flex;
      justify-content: space-between;
      align-items: center;
      gap: 16px;
      border-top: 1px solid var(--line);
      padding-top: 17px;
      color: var(--muted);
      font-size: 8px;
      letter-spacing: .2em;
      text-transform: uppercase;
    }

    @media (max-width: 850px) {
      .page-shell { padding: 22px 20px 18px; }

      .main {
        grid-template-columns: 1fr;
        gap: 34px;
        padding: 42px 0;
      }

      .intro {
        align-items: center;
        padding: 0;
        text-align: center;
      }

      .brand-mark {
        width: min(72%, 340px);
        margin-bottom: 45px;
      }

      h1 { font-size: clamp(62px, 13vw, 92px); }
      .statement { max-width: 390px; }
      .supporting { margin-top: 24px; }

      .image-composition {
        grid-template-columns: repeat(2, minmax(0, 1fr));
        max-height: none;
        overflow: visible;
        gap: 9px;
      }

      .image-column:nth-child(3) { display: contents; }
      .image-column:nth-child(2) { padding-top: 0; }

      .image-column { gap: 7px; }
      .image-column:nth-child(2) { padding-top: 28px; }
      .image-column:nth-child(3) { padding-top: 12px; }
      .footer { font-size: 7px; }
    }

    @media (max-width: 480px) {
      .topbar { font-size: 8px; }
      .image-composition { gap: 7px; }
      .image-column { gap: 7px; }

      .footer {
        flex-direction: column;
        justify-content: center;
        gap: 9px;
      }
    }

    @media (prefers-reduced-motion: no-preference) {
      .intro { animation: reveal .9s ease both; }
      .image-column { animation: rise .9s ease both; }
      .image-column:nth-child(2) { animation-delay: .12s; }
      .image-column:nth-child(3) { animation-delay: .22s; }

      @keyframes reveal {
        from { opacity: 0; transform: translateY(12px); }
        to { opacity: 1; transform: translateY(0); }
      }

      @keyframes rise {
        from { opacity: 0; transform: translateY(18px); }
        to { opacity: 1; transform: translateY(0); }
      }
    }
  </style>
</head>

<body>
  <div class="page-shell">
    <header class="topbar">
      <span class="topbar-place">London · United Kingdom</span>
    </header>

    <main class="main">
      <section class="intro" aria-labelledby="coming-soon">
        <img class="brand-mark" src="assets/luisa-logo.png" alt="LUISA London">
        <p class="eyebrow">A new expression of textile design</p>
        <h1 id="coming-soon">Coming<br>soon.</h1>
        <div class="rule" aria-hidden="true"></div>
        <p class="statement">A considered approach to craftsmanship, colour and form.</p>
        <p class="supporting">The house is preparing its first collection.</p>
      </section>

      <section class="image-composition" aria-label="Textile and fashion visual references">
        <div class="image-column">
          <img src="assets/look-01.png" alt="Emerald crochet jacket in an editorial portrait" fetchpriority="high">
        </div>
        <div class="image-column">
          <img src="assets/look-04.png" alt="Sculptural crochet handbag with blue textile" loading="lazy">
          <img src="assets/look-09.png" alt="Turquoise crochet purse with red and deep-purple stripes, tan handles, no logo" loading="lazy">
          <img src="assets/look-08.png" alt="Saffron and wine crochet jacket in the studio" loading="lazy">
        </div>
        <div class="image-column">
          <img src="assets/look-06.png" alt="Cobalt and rust crochet textile detail" loading="lazy">
        </div>
      </section>
    </main>

    <footer class="footer">
      <span>LUISA © 2026</span>
      <span>Design · Craft · Expression</span>
    </footer>
  </div>
</body>
</html>

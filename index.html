<!doctype html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="theme-color" content="#fffaf4">
<title>Luisa — Handmade Crochet</title>
<meta name="description" content="Handmade crochet gifts, accessories and playful pieces by Luisa.">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=DM+Sans:wght@400;500;600;700&family=Fredoka:wght@500;600;700&display=swap" rel="stylesheet">
<style>
:root{--cream:#fffaf4;--paper:#fffdf9;--pink:#ef4261;--ink:#603744;--sage:#8a9e71;--muted:#ad9296;--line:#f0e4dc;--shadow:0 14px 35px rgba(111,66,65,.08)}*{box-sizing:border-box}html{scroll-behavior:smooth}body{margin:0;background:var(--cream);color:var(--ink);font-family:'DM Sans',sans-serif}a{color:inherit;text-decoration:none}button{font:inherit}.topbar{height:104px;background:var(--paper);display:flex;align-items:center;justify-content:space-between;padding:0 clamp(22px,6vw,76px);gap:24px}.brand{display:inline-flex;align-items:center;gap:14px;color:var(--pink);font:700 clamp(38px,5vw,60px)/1 'Fredoka',sans-serif;letter-spacing:.025em}.brand-heart{font-size:.78em;display:inline-block;transform:rotate(-8deg)}.sprig{display:flex;flex-direction:column;gap:5px}.sprig i{display:block;width:17px;height:7px;border-radius:100%;background:var(--sage)}.sprig.left i:first-child{transform:rotate(34deg)}.sprig.left i:nth-child(2){transform:rotate(0)}.sprig.left i:last-child{transform:rotate(-34deg)}.sprig.right i:first-child{transform:rotate(-34deg)}.sprig.right i:nth-child(2){transform:rotate(0)}.sprig.right i:last-child{transform:rotate(34deg)}.header-actions{display:flex;align-items:center;gap:26px}.shop-link{font-size:20px;font-weight:600}.cart{position:relative;border:0;background:none;color:var(--ink);padding:4px;cursor:pointer}.cart svg{width:39px;height:39px;stroke:currentColor;stroke-width:2;fill:none;stroke-linecap:round;stroke-linejoin:round}.cart-count{position:absolute;top:-5px;right:-7px;width:25px;height:25px;border-radius:50%;display:grid;place-items:center;background:var(--pink);color:white;font-size:12px;font-weight:700}.language{display:flex;gap:3px;border:1px solid var(--line);border-radius:30px;padding:3px}.language button{border:0;background:transparent;color:var(--ink);padding:5px 8px;border-radius:20px;font-size:11px;font-weight:700;cursor:pointer}.language button[aria-pressed=true]{background:var(--ink);color:white}.hero{min-height:550px;display:grid;grid-template-columns:.92fr 1.08fr;align-items:center;overflow:hidden;padding:36px 0 36px clamp(24px,6vw,76px);background:#f9ede5}.hero-copy{position:relative;z-index:1;padding:24px 0}.hero h1{font:600 clamp(40px,5.3vw,68px)/1.08 'Fredoka',sans-serif;letter-spacing:-.025em;margin:0 0 23px;color:var(--ink);max-width:530px}.hero h1 span{display:block}.hero-copy p{font-size:17px;line-height:1.6;max-width:360px;margin:0 0 27px;color:#80656a}.button{display:inline-flex;align-items:center;gap:12px;background:var(--pink);color:white;border:0;border-radius:50px;padding:15px 28px;font-weight:700;letter-spacing:.01em;box-shadow:0 6px 14px rgba(239,66,97,.16);transition:transform .2s,background .2s}.button:hover{background:#dc3555;transform:translateY(-2px)}.hero-photo{height:100%;min-height:475px;max-height:540px;align-self:stretch;background:#f4dfd6;overflow:hidden;border-radius:30% 0 0 30%}.hero-photo img{width:100%;height:100%;min-height:475px;object-fit:cover;object-position:58% 50%;display:block}.shop-section{padding:36px clamp(22px,5vw,54px) 66px}.section-heading{display:flex;align-items:center;justify-content:center;gap:17px;text-align:center;margin:0 0 29px}.section-heading h2{font:600 clamp(34px,4vw,50px)/1.1 'Fredoka',sans-serif;margin:0}.section-heading .sprig{transform:scale(.9)}.products{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:clamp(18px,3.3vw,36px);max-width:1260px;margin:0 auto}.product{min-width:0}.photo-wrap{position:relative;overflow:hidden;border-radius:12px;background:#f4e6df;aspect-ratio: .73;box-shadow:var(--shadow)}.photo-wrap img{width:100%;height:100%;object-fit:cover;display:block;transition:transform .35s}.product:hover .photo-wrap img{transform:scale(1.035)}.product-meta{display:flex;align-items:flex-start;justify-content:space-between;gap:12px;padding:15px 5px 4px}.product h3{font-size:clamp(17px,2vw,22px);font-weight:500;margin:0}.price{font-size:17px;color:var(--muted);font-weight:600;white-space:nowrap}.add{margin:5px 5px 0;background:none;border:0;padding:7px 0;color:var(--pink);font-size:13px;font-weight:700;cursor:pointer}.add:hover{text-decoration:underline}.divider{display:flex;justify-content:center;align-items:center;gap:8px;margin:56px 0 0}.divider .sprig{transform:scale(.72)}.divider .heart{color:var(--pink);font-size:22px}.wave{height:24px;background:radial-gradient(18px 12px at 18px 0,#f8cad0 97%,transparent 100%) 0 0/36px 24px repeat-x;margin-top:44px}footer{text-align:center;padding:23px 16px 30px;color:#977d82;font-size:12px}.notice{position:fixed;bottom:18px;left:50%;transform:translate(-50%,20px);opacity:0;pointer-events:none;background:var(--ink);color:white;border-radius:30px;padding:12px 18px;font-size:13px;transition:all .25s;z-index:4}.notice.show{opacity:1;transform:translate(-50%,0)}
@media(max-width:760px){.topbar{height:82px;padding:0 18px}.brand{font-size:40px;gap:9px}.brand .sprig{transform:scale(.78)}.header-actions{gap:14px}.shop-link{font-size:17px}.cart svg{width:32px;height:32px}.language{gap:1px}.language button{padding:4px 6px}.hero{grid-template-columns:1fr;gap:26px;padding:32px 20px 0;min-height:0}.hero-copy{padding:10px 2px 0}.hero h1{font-size:clamp(42px,10vw,62px);margin-bottom:15px}.hero-copy p{font-size:15px;margin-bottom:20px}.hero-photo{height:340px;min-height:0;max-height:none;margin:0 -20px;border-radius:42% 42% 0 0}.hero-photo img{min-height:0;object-position:56% 53%}.shop-section{padding:36px 18px 48px}.products{gap:13px}.photo-wrap{border-radius:9px}.product-meta{display:block;padding:10px 2px 0}.product h3{font-size:15px;line-height:1.25}.price{font-size:14px;display:block;margin-top:4px}.add{font-size:12px;margin-left:2px}.section-heading{gap:8px;margin-bottom:20px}.section-heading .sprig{transform:scale(.65)}.section-heading h2{font-size:34px}.divider{margin-top:38px}.wave{margin-top:32px}}
@media(max-width:390px){.topbar{gap:8px}.brand{font-size:34px;gap:6px}.brand .sprig i{width:13px;height:6px}.header-actions{gap:9px}.shop-link{font-size:15px}.language button{font-size:10px;padding:4px 5px}.products{gap:10px}.product h3{font-size:14px}}
</style>
</head>
<body>
<header class="topbar">
  <a class="brand" href="#top" aria-label="Luisa home"><span class="sprig left" aria-hidden="true"><i></i><i></i><i></i></span><span>L<span class="brand-heart">♥</span>ISA</span><span class="sprig right" aria-hidden="true"><i></i><i></i><i></i></span></a>
  <div class="header-actions"><a class="shop-link" href="#shop" data-en="Shop" data-pt="Loja">Shop</a><button class="cart" type="button" aria-label="Shopping bag"><svg viewBox="0 0 40 40" aria-hidden="true"><path d="M7 13h26l-3 22H10L7 13Z"/><path d="M14 15V10a6 6 0 0 1 12 0v5"/></svg><span class="cart-count" id="cart-count">0</span></button><div class="language" role="group" aria-label="Website language"><button type="button" data-lang="en" aria-pressed="true">EN</button><button type="button" data-lang="pt" aria-pressed="false">PT</button></div></div>
</header>
<main id="top">
  <section class="hero" aria-labelledby="hero-title"><div class="hero-copy"><h1 id="hero-title"><span data-en="Handmade crochet" data-pt="Croché feito à mão">Handmade crochet</span><span data-en="for everyday joy." data-pt="para todos os dias.">for everyday joy.</span></h1><p data-en="Crochet gifts, accessories and playful pieces." data-pt="Presentes, acessórios e peças divertidas em croché.">Crochet gifts, accessories and playful pieces.</p><a class="button" href="#shop"><span data-en="SHOP THE COLLECTION" data-pt="VER A COLEÇÃO">SHOP THE COLLECTION</span><span aria-hidden="true">→</span></a></div><div class="hero-photo"><img src="./images/luisa-hero.jpg" alt="Crochet cherry keychain and smiling yellow star" fetchpriority="high"></div></section>
  <section class="shop-section" id="shop"><div class="section-heading"><span class="sprig left" aria-hidden="true"><i></i><i></i><i></i></span><h2 data-en="Featured picks" data-pt="Destaques">Featured picks</h2><span class="sprig right" aria-hidden="true"><i></i><i></i><i></i></span></div><div class="products">
    <article class="product"><div class="photo-wrap"><img src="./images/cherry-keychain.jpg" alt="Red crochet cherry keychain" loading="lazy"></div><div class="product-meta"><h3 data-en="Cherry Keychain" data-pt="Porta-chaves cerejas">Cherry Keychain</h3><span class="price">€14</span></div><button class="add" type="button" data-add data-en="+ Add to bag" data-pt="+ Adicionar ao saco">+ Add to bag</button></article>
    <article class="product"><div class="photo-wrap"><img src="./images/smiling-star.jpg" alt="Yellow crochet star with a smiling face" loading="lazy"></div><div class="product-meta"><h3 data-en="Smiling Star" data-pt="Estrela sorridente">Smiling Star</h3><span class="price">€16</span></div><button class="add" type="button" data-add data-en="+ Add to bag" data-pt="+ Adicionar ao saco">+ Add to bag</button></article>
    <article class="product"><div class="photo-wrap"><img src="./images/mini-space-bundle.jpg" alt="Crochet rocket, planets and moon bundle" loading="lazy"></div><div class="product-meta"><h3 data-en="Mini Space Bundle" data-pt="Mini conjunto espacial">Mini Space Bundle</h3><span class="price">€26</span></div><button class="add" type="button" data-add data-en="+ Add to bag" data-pt="+ Adicionar ao saco">+ Add to bag</button></article>
  </div><div class="divider" aria-hidden="true"><span class="sprig left"><i></i><i></i><i></i></span><span class="heart">♥</span><span class="sprig right"><i></i><i></i><i></i></span></div></section>
  <div class="wave" aria-hidden="true"></div>
</main>
<footer>© <span id="year"></span> Luisa · Handmade crochet</footer><div class="notice" id="notice" role="status" aria-live="polite"></div>
<script>
const labels={en:{bag:'Shopping bag',added:'Added to bag'},pt:{bag:'Saco de compras',added:'Adicionado ao saco'}};
let lang='en',count=0;
const countNode=document.getElementById('cart-count'),notice=document.getElementById('notice');let noticeTimer;
function setLanguage(next){lang=next;document.documentElement.lang=next==='pt'?'pt-PT':'en';document.querySelectorAll('[data-en][data-pt]').forEach(el=>{el.textContent=el.dataset[next]});document.querySelectorAll('[data-lang]').forEach(btn=>btn.setAttribute('aria-pressed',String(btn.dataset.lang===next)));document.querySelector('.cart').setAttribute('aria-label',labels[next].bag);document.title=next==='pt'?'Luisa — Croché feito à mão':'Luisa — Handmade Crochet';}
document.querySelectorAll('[data-lang]').forEach(btn=>btn.addEventListener('click',()=>setLanguage(btn.dataset.lang)));
document.querySelectorAll('[data-add]').forEach(btn=>btn.addEventListener('click',()=>{countNode.textContent=++count;notice.textContent=labels[lang].added;notice.classList.add('show');clearTimeout(noticeTimer);noticeTimer=setTimeout(()=>notice.classList.remove('show'),1600)}));
document.getElementById('year').textContent=new Date().getFullYear();
</script>
</body>
</html>
